name: Import Images
on: workflow_dispatch

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Babashka
        uses: turtlequeue/setup-babashka@v1.7.0
        with:
          babashka-version: 1.13.225

      - uses: actions/setup-go@v4
        with:
          go-version: '^1.26.2'

      - name: Install Rclone, ImageMagick, and ExifTool
        run: sudo apt install -y imagemagick rclone exiftool
      
      - name: Build SnowflakeId Pod
        run: |
          go mod tidy -C ./pod/snowflakeid
          go build -C ./pod/snowflakeid

      - name: Import New Signs
        run: bb import-signs
        env:
          JDBC_URL: ${{ secrets.JDBC_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RCLONE_CONFIG_R2_TYPE: ${{ vars.RCLONE_CONFIG_TYPE }}
          RCLONE_CONFIG_R2_PROVIDER: ${{ vars.RCLONE_CONFIG_PROVIDER }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.R2_ENDPOINT_URL }}

