name: Import Images
on: workflow_dispatch

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install image processing dependencies
        run: sudo apt install -y libheif-dev libwebp-dev

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '23'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.3.1463

      - name: Debug HEIF compression types
        run: clojure -M -e "(require 'dev) (dev/print-heif-compression-types)" -J--enable-native-access=ALL-UNNAMED

